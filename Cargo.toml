[package]
name = "bevy_northstar"
version = "0.8.0"
edition = "2024"
authors = ["John Mullins"]
description = "A Bevy plugin for Hierarchical Pathfinding"
homepage = "https://github.com/jtothethree/bevy_northstar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jtothethree/bevy_northstar"
categories = ["game-development"]
keywords = ["astar", "bevy", "game", "hpa", "pathfinding"]
exclude = ["assets/*", "res/*"]
autoexamples = false

[[example]]
name = "demo"
required-features = ["stats", "render"]

[[example]]
name = "isometric"
required-features = ["render"]

[[example]]
name = "collision_testing"
required-features = ["stats", "render"]

[[example]]
name = "basic"
required-features = ["render"]

[[example]]
name = "nav_mask"

[[example]]
name = "freeform_movement"
required-features = ["render"]

[[example]]
name = "reroute"
required-features = ["render"]

[[bench]]
harness = false
name = "benches"

[dependencies]
indexmap = "2.14.2"
ndarray = { version = "0.17.2" }
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"
slab = "0.4.12"
smallvec = "1.16.3"

[dependencies.bevy]
version = "0.20"
default-features = false
features = ["bevy_log"]

[dev-dependencies]
bevy = { version = "0.20", features = ["bevy_dev_tools"] }
bevy_dev_tools = { version = "0.20", features = ["render"] }
bevy_ecs_tiled = { version = "0.14", features = ["user_properties"] }
ndshape = { version = "0.3.0" }

[target.'cfg(not(target_os = "windows"))']
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
criterion = { version = "0.5.0" }
pprof = { version = "0.15.0", features = ["criterion", "flamegraph"] }
rand = "0.10.3"
tiled = { version = "0.16.0" }

[features]
default = ["parallel", "render"]
parallel = ["ndarray/rayon", "rayon"]
render = ["bevy/bevy_gizmos", "bevy/bevy_render"]
stats = []
